<!doctype html>
<html lang="ro">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Potree-Net — Digitizare Stereo 70</title>
	<link rel="stylesheet" href="resources/potree.css">
	<style>
		html,body,#potree-net{width:100%;height:100%;margin:0;overflow:hidden;background:#111821}
		#canvas{display:block;width:100%;height:100%}
		#gaussian-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;display:none}
		#project-badge{position:absolute;left:12px;top:12px;z-index:10;padding:8px 11px;border-radius:7px;
			background:rgba(16,21,28,.88);border:1px solid #364252;color:#e8eef5;font:12px Inter,Segoe UI,sans-serif}
		#project-badge strong{display:block;font-size:14px}#cloud-status{color:#91a0b3;margin-top:2px}
		#hybrid-controls{position:absolute;top:12px;right:320px;z-index:10;padding:8px;border-radius:8px;
			background:rgba(16,21,28,.9);border:1px solid #364252;color:#e8eef5;font:12px Inter,Segoe UI,sans-serif}
		#hybrid-buttons{display:flex;gap:5px}
		#hybrid-buttons button{padding:6px 9px;border:1px solid #4b5a6c;border-radius:5px;background:#202b38;color:#cbd5e1;
			font:600 11px Inter,Segoe UI,sans-serif;cursor:pointer}
		#hybrid-buttons button:hover{background:#2c3a49}#hybrid-buttons button[aria-pressed="true"]{border-color:#52b8ff;background:#14547b;color:#fff}
		#layer-status{max-width:280px;margin-top:6px;color:#91a0b3;text-align:right}
		@media(max-width:900px){#hybrid-controls{top:92px;right:12px}}
	</style>
</head>
<body>
	<div id="potree-net">
		<canvas id="canvas"></canvas>
		<canvas id="gaussian-canvas" aria-label="Strat Gaussian Splats"></canvas>
		<pre id="msg_resources" hidden></pre>
		<pre id="msg_dbg" hidden></pre>
		<div id="project-badge"><strong>11-CORNU · Cârcea</strong><span>Stereo 70 · ridicare 30.06.2026</span><div id="cloud-status">Inițializare WebGPU…</div></div>
		<div id="hybrid-controls" aria-label="Control straturi 3D">
			<div id="hybrid-buttons">
				<button type="button" data-layer-mode="POINTS">POINTS</button>
				<button type="button" data-layer-mode="SPLATS">SPLATS</button>
				<button type="button" data-layer-mode="HYBRID">HYBRID</button>
			</div>
			<div id="layer-status" role="status">Niciun strat 3D disponibil</div>
		</div>
	</div>

	<script type="importmap">
	{
		"imports": {
			"potree": "./src/Potree.js",
			"lazperf": "./libs/laz-perf/laz-perf.js",
			"BinaryHeap": "./libs/BinaryHeap/BinaryHeap.js",
			"tween": "./libs/tween/tween.esm.js",
			"json5": "./libs/json5/json5.js",
			"proj4": "./libs/proj4js/proj4-src.js",
			"radix-sort-esm": "./libs/webgpu-radix-sort/dist/esm/radix-sort-esm.js"
		}
	}
	</script>

	<script type="module">
		import {Potree, PotreeLoader, SplatType, Matrix4} from "potree";
		import {Digitizer} from "./src/modules/digitizer/Digitizer.js";
		import {HybridLayerController, HybridLayerMode} from "./src/modules/hybrid/HybridLayerController.js";
		import {applySplatPlacement, parseSplatPlacement} from "./src/modules/hybrid/SplatPlacement.js";
		import {createNativeGaussianRenderer} from "./src/modules/gaussians/native/NativeGaussianRenderer.js";
		import {createNativeFixtureFromSplatData} from "./src/modules/gaussians/native/NativeGaussianAdapter.js";

		let canvas = document.querySelector("#canvas");
		let gaussianCanvas = document.querySelector("#gaussian-canvas");
		let status = document.querySelector("#cloud-status");
		let layerStatus = document.querySelector("#layer-status");
		let layerButtons = [...document.querySelectorAll("[data-layer-mode]")];
		let app = await Potree.init(canvas);
		app.renderer.device.addEventListener("uncapturederror", event => {
			console.error("WebGPU uncaptured error", event.error);
			layerStatus.textContent = `Eroare WebGPU: ${event.error?.message ?? "necunoscută"}`;
		});
		window.Potree = Potree;
		window.potreeNet = app;

		let gaussianContext = gaussianCanvas.getContext("webgpu");
		let gaussianFormat = navigator.gpu.getPreferredCanvasFormat();
		gaussianContext.configure({
			device: app.renderer.device,
			format: gaussianFormat,
			alphaMode: "premultiplied",
			usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
		});
		let nativeGaussianRenderer = createNativeGaussianRenderer({
			device: app.renderer.device,
			context: gaussianContext,
			format: gaussianFormat,
		});
		window.nativeGaussianRenderer = nativeGaussianRenderer;

		Potree.settings.edlEnabled = true;
		Potree.settings.hqsEnabled = true;
		Potree.settings.pointBudget = 6_000_000;
		Potree.settings.attribute = "rgba";
		Potree.settings.splatType = SplatType.POINTS;
		Potree.settings.pointSize = 2;
		Potree.settings.minNodeSize = 120;

		let params = new URLSearchParams(location.search);
		let cloudUrl = params.get("cloud") ?? "./resources/pointclouds/11-CORNU/metadata.json";
		let splatUrl = params.get("splat");
		let projectName = params.get("project") ?? "11-CORNU";
		let splatPixelScale = Number(params.get("splatPixelScale") ?? 1000);
		if(!Number.isFinite(splatPixelScale) || splatPixelScale <= 0){
			throw new RangeError("splatPixelScale trebuie să fie strict pozitiv");
		}
		let requestedMode = params.get("mode")?.toUpperCase();
		if(!Object.hasOwn(HybridLayerMode, requestedMode)){
			requestedMode = splatUrl ? HybridLayerMode.HYBRID : HybridLayerMode.POINTS;
		}

		let hybridController = new HybridLayerController({
			mode: requestedMode,
			onChange: state => {
				layerStatus.textContent = state.status;
				gaussianCanvas.style.display = state.effectiveMode === HybridLayerMode.SPLATS ||
					state.effectiveMode === HybridLayerMode.HYBRID ? "block" : "none";
				for(let button of layerButtons){
					button.setAttribute("aria-pressed", String(button.dataset.layerMode === state.requestedMode));
				}
			},
		});
		window.hybridController = hybridController;
		let loadedPointcloud = null;
		let loadedSplat = null;
		let nativeSplatUploaded = false;
		const nativeViewProjection = new Matrix4();
		Potree.events.onFrameEnd(() => {
			if(!loadedSplat?.visible || !nativeSplatUploaded || gaussianCanvas.style.display === "none") return;
			const dpr = Math.min(devicePixelRatio || 1, 2);
			const width = Math.max(1, Math.floor(gaussianCanvas.clientWidth * dpr));
			const height = Math.max(1, Math.floor(gaussianCanvas.clientHeight * dpr));
			if(gaussianCanvas.width !== width || gaussianCanvas.height !== height){
				gaussianCanvas.width = width;
				gaussianCanvas.height = height;
			}
			loadedSplat.updateWorld();
			nativeViewProjection.multiplyMatrices(app.camera.proj, app.camera.view).multiply(loadedSplat.world);
			nativeGaussianRenderer.render({
				viewProjection: new Float32Array(nativeViewProjection.elements),
				viewport: [width, height],
				clearColor: [0, 0, 0, 0],
			});
		});
		for(let button of layerButtons){
			button.addEventListener("click", () => {
				const state = hybridController.setMode(button.dataset.layerMode);
				const focusLayer = state.effectiveMode === HybridLayerMode.SPLATS
					? loadedSplat
					: loadedPointcloud;
				if(focusLayer) app.controls.zoomTo(focusLayer, {zoom: 1.05});
			});
		}

		let formatBytes = bytes => `${(bytes / 1_000_000_000).toFixed(2)} GB`;

		async function verifyCloudFiles(metadataUrl){
			let hierarchyUrl = new URL("hierarchy.bin", new URL(metadataUrl, location.href));
			let octreeUrl = new URL("octree.bin", new URL(metadataUrl, location.href));
			let hierarchyResponse = await fetch(hierarchyUrl, {headers: {Range: "bytes=0-21"}});
			let hierarchy = new DataView(await hierarchyResponse.arrayBuffer());
			if(hierarchy.byteLength < 22){
				throw new Error("hierarchy.bin este incomplet");
			}

			let rootOffset = Number(hierarchy.getBigInt64(6, true));
			let rootSize = Number(hierarchy.getBigInt64(14, true));
			let minimumOctreeSize = rootOffset + rootSize;
			let octreeResponse = await fetch(octreeUrl, {method: "HEAD"});
			let availableOctreeSize = Number(octreeResponse.headers.get("content-length"));

			if(availableOctreeSize < minimumOctreeSize){
				throw new Error(`octree.bin se sincronizează: ${formatBytes(availableOctreeSize)} / minimum ${formatBytes(minimumOctreeSize)}`);
			}
		}

		async function loadPointcloud(){
			try{
				status.textContent = "Verificare fișiere nor…";
				await verifyCloudFiles(cloudUrl);
				status.textContent = "Încărcare nor…";
				let pointcloud = await PotreeLoader.load(cloudUrl);
				loadedPointcloud = pointcloud;
				pointcloud.name = projectName;
				app.scene.root.children.push(pointcloud);
				hybridController.setPointcloud(pointcloud);
				if(hybridController.getState().effectiveMode !== HybridLayerMode.SPLATS){
					app.controls.zoomTo(pointcloud, {zoom: 1.05});
				}
				status.textContent = "Nor încărcat · digitizarea este activă";
				return pointcloud;
			}catch(error){
				console.warn(error.message);
				status.textContent = `Eroare nor: ${error.message}`;
				return null;
			}
		}

		async function loadSplat(){
			if(!splatUrl) return null;

			try{
				layerStatus.textContent = "Încărcare Gaussian Splats…";
				const placement = parseSplatPlacement(params);
				const {GSLoader} = await import("./src/modules/gaussians/GSLoader.js");
				let splat = await GSLoader.load(splatUrl);
				loadedSplat = splat;
				splat.name = `${projectName} · Gaussian Splats`;
				applySplatPlacement(splat, placement);
				hybridController.setSplat(splat);
				await splat.loading;
				if(splat.loadError) throw splat.loadError;
				const fixture = createNativeFixtureFromSplatData({
					count: splat.numSplats,
					uploadedCount: splat.numSplatsLoaded,
					...splat.splatData,
				}, {pixelScale: splatPixelScale});
				nativeGaussianRenderer.upload(fixture);
				nativeSplatUploaded = true;
				layerStatus.textContent = `${hybridController.getState().status} · ${fixture.count.toLocaleString("ro-RO")} splaturi native`;
				if(hybridController.getState().effectiveMode === HybridLayerMode.SPLATS){
					app.controls.zoomTo(splat, {zoom: 1.05});
				}
				return splat;
			}catch(error){
				console.warn(error.message);
				nativeSplatUploaded = false;
				hybridController.setSplat(null);
				layerStatus.textContent = `Eroare splats · ${hybridController.getState().status}`;
				return null;
			}
		}

		window.digitizer = new Digitizer(app, {container: document.querySelector("#potree-net"), projectName});
		await Promise.all([loadPointcloud(), loadSplat()]);
	</script>
</body>
</html>
